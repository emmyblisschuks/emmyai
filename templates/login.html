<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EmmyAI — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Söhne:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0d0d;
  --surface:#1a1a1a;
  --border:#2d2d2d;
  --accent:#10a37f;
  --accent-hover:#0d8f6f;
  --tx:#ececec;
  --mu:#8e8ea0;
  --error:#ff4d4f;
  --input-bg:#141414;
}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--tx);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% -10%, rgba(16,163,127,0.12), transparent);
  pointer-events:none;
}
.card{
  width:100%;
  max-width:380px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:2.5rem 2rem;
  position:relative;
  z-index:1;
}
.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:2rem;
}
.logo-icon{
  width:40px;height:40px;
  background:var(--accent);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.logo-text{
  font-size:22px;
  font-weight:600;
  letter-spacing:-0.02em;
}
.logo-text span{color:var(--accent);}
h2{
  font-size:20px;
  font-weight:600;
  text-align:center;
  margin-bottom:0.4rem;
  letter-spacing:-0.01em;
}
.sub{
  text-align:center;
  font-size:13px;
  color:var(--mu);
  margin-bottom:1.8rem;
}
.tabs{
  display:flex;
  background:var(--input-bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:4px;
  margin-bottom:1.5rem;
  gap:4px;
}
.tab{
  flex:1;
  padding:8px;
  text-align:center;
  font-size:13px;
  font-weight:500;
  border-radius:7px;
  cursor:pointer;
  color:var(--mu);
  transition:all .2s;
  border:none;
  background:transparent;
}
.tab.active{
  background:var(--surface);
  color:var(--tx);
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.field{margin-bottom:1rem;}
.field label{
  display:block;
  font-size:12px;
  font-weight:500;
  color:var(--mu);
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.field input{
  width:100%;
  padding:11px 14px;
  background:var(--input-bg);
  border:1px solid var(--border);
  border-radius:9px;
  color:var(--tx);
  font-size:14px;
  font-family:'Inter',sans-serif;
  outline:none;
  transition:border-color .2s;
}
.field input:focus{border-color:var(--accent);}
.field input::placeholder{color:var(--mu);}
.btn{
  width:100%;
  padding:12px;
  background:var(--accent);
  border:none;
  border-radius:9px;
  color:#fff;
  font-size:14px;
  font-weight:600;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  transition:background .2s;
  margin-top:0.5rem;
}
.btn:hover{background:var(--accent-hover);}
.btn:disabled{opacity:0.6;cursor:not-allowed;}
.error-msg{
  background:rgba(255,77,79,0.1);
  border:1px solid rgba(255,77,79,0.3);
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  color:var(--error);
  margin-bottom:1rem;
  display:none;
}
.form-section{display:none;}
.form-section.active{display:block;}
.footer-note{
  text-align:center;
  font-size:11px;
  color:var(--mu);
  margin-top:1.5rem;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <div class="logo-text"><span>Emmy</span>AI</div>
  </div>
  <h2>Welcome back</h2>
  <p class="sub">Sign in to continue your conversations</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Sign In</button>
    <button class="tab" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <!-- Login Form -->
  <div id="loginForm" class="form-section active">
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••"/>
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    <div style="text-align:center;margin-top:12px;font-size:13px;"><a href="/forgot-password" style="color:var(--accent);text-decoration:none;">Forgot password?</a></div>
  </div>

  <!-- Signup Form -->
  <div id="signupForm" class="form-section">
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="Your name"/>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Min. 6 characters"/>
    </div>
    <button class="btn" id="signupBtn" onclick="doSignup()">Create Account</button>
  </div>

  <p class="footer-note">Built by EmmyTech · Powered by Groq AI</p>
</div>

<script>
let currentTab = 'login';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
  });
  document.getElementById('loginForm').classList.toggle('active', tab === 'login');
  document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
  hideError();
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('errorMsg').style.display = 'none';
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return showError('Please fill in all fields');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (data.success) window.location.href = '/';
    else showError(data.error || 'Something went wrong');
  } catch(e) { showError('Connection error. Try again.'); }
  btn.disabled = false; btn.textContent = 'Sign In';
}

async function doSignup() {
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  if (!name || !email || !password) return showError('Please fill in all fields');
  if (password.length < 6) return showError('Password must be at least 6 characters');
  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const res = await fetch('/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, email, password})
    });
    const data = await res.json();
    if (data.success) window.location.href = '/';
    else showError(data.error || 'Something went wrong');
  } catch(e) { showError('Connection error. Try again.'); }
  btn.disabled = false; btn.textContent = 'Create Account';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (currentTab === 'login') doLogin();
    else doSignup();
  }
});
</script>
</body>
</html>
