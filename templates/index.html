<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EmmyAI — Your Smart Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0d0d;
  --sidebar:#171717;
  --surface:#1e1e1e;
  --border:#2d2d2d;
  --accent:#10a37f;
  --accent-hover:#0d8f6f;
  --tx:#ececec;
  --mu:#8e8ea0;
  --user-bg:#2a2a2a;
  --danger:#ff4d4f;
}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--tx);
  height:100vh;
  display:flex;
  overflow:hidden;
  font-size:15px;
}

/* Sidebar */
.sidebar{
  width:260px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  transition:transform .3s;
}
.sidebar-top{
  padding:1rem;
  border-bottom:1px solid var(--border);
}
.new-chat-btn{
  width:100%;
  padding:10px 14px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--tx);
  font-size:13px;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:background .2s;
}
.new-chat-btn:hover{background:var(--surface);}
.new-chat-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;flex-shrink:0;}
.sidebar-label{
  padding:1rem 1rem 0.5rem;
  font-size:11px;
  font-weight:500;
  color:var(--mu);
  text-transform:uppercase;
  letter-spacing:.06em;
}
.chat-list{
  flex:1;
  overflow-y:auto;
  padding:0 0.5rem;
}
.chat-list::-webkit-scrollbar{width:3px;}
.chat-list::-webkit-scrollbar-thumb{background:var(--border);}
.chat-item{
  padding:9px 10px;
  border-radius:7px;
  cursor:pointer;
  font-size:13px;
  color:var(--mu);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:2px;
  transition:background .15s;
}
.chat-item:hover{background:var(--surface);color:var(--tx);}
.chat-item.active{background:var(--surface);color:var(--tx);}
.chat-title{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.chat-del{
  opacity:0;
  font-size:14px;
  color:var(--mu);
  padding:2px 4px;
  border-radius:4px;
  border:none;
  background:transparent;
  cursor:pointer;
  flex-shrink:0;
}
.chat-item:hover .chat-del{opacity:1;}
.chat-del:hover{color:var(--danger);}
.sidebar-bottom{
  padding:1rem;
  border-top:1px solid var(--border);
}
.user-info{
  display:flex;
  align-items:center;
  gap:10px;
}
.user-avatar{
  width:32px;height:32px;
  border-radius:50%;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  font-weight:600;
  color:#fff;
  flex-shrink:0;
}
.user-name{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.logout-btn{
  font-size:12px;
  color:var(--mu);
  background:transparent;
  border:none;
  cursor:pointer;
  padding:4px 8px;
  border-radius:5px;
  transition:color .2s;
}
.logout-btn:hover{color:var(--danger);}

/* Main */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

/* Mobile header */
.mobile-header{
  display:none;
  padding:0.75rem 1rem;
  border-bottom:1px solid var(--border);
  align-items:center;
  gap:12px;
  background:var(--sidebar);
  flex-shrink:0;
}
.menu-btn{
  background:transparent;
  border:none;
  color:var(--tx);
  cursor:pointer;
  padding:4px;
  display:flex;
}
.menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;}
.mobile-title{font-size:15px;font-weight:600;flex:1;}
.mobile-title span{color:var(--accent);}

/* Chat area */
.chat-area{
  flex:1;
  overflow-y:auto;
  padding:0;
}
.chat-area::-webkit-scrollbar{width:4px;}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* Welcome */
.welcome{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100%;
  padding:2rem 1rem;
  text-align:center;
}
.welcome-icon{
  font-size:48px;
  margin-bottom:1.5rem;
}
.welcome h1{
  font-size:28px;
  font-weight:600;
  letter-spacing:-0.02em;
  margin-bottom:0.5rem;
}
.welcome h1 span{color:var(--accent);}
.welcome p{font-size:14px;color:var(--mu);margin-bottom:2rem;max-width:400px;line-height:1.6;}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:500px;}
.sug{
  padding:9px 16px;
  font-size:13px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--surface);
  color:var(--mu);
  cursor:pointer;
  transition:all .2s;
  font-family:'Inter',sans-serif;
}
.sug:hover{border-color:var(--accent);color:var(--tx);}

/* Messages */
.messages{padding:1.5rem 0;}
.msg{
  padding:1rem 1.5rem;
  display:flex;
  gap:12px;
  max-width:760px;
  margin:0 auto;
  width:100%;
}
.msg.user{flex-direction:row-reverse;}
.msg-avatar{
  width:30px;height:30px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  font-weight:600;
  flex-shrink:0;
  margin-top:2px;
}
.msg.user .msg-avatar{background:var(--accent);color:#fff;}
.msg.ai .msg-avatar{background:var(--surface);border:1px solid var(--border);}
.msg-content{
  flex:1;
  font-size:15px;
  line-height:1.7;
  color:var(--tx);
  max-width:calc(100% - 42px);
}
.msg.user .msg-content{
  background:var(--user-bg);
  padding:12px 16px;
  border-radius:12px 12px 3px 12px;
  max-width:75%;
}
.msg-content p{margin-bottom:10px;}
.msg-content p:last-child{margin-bottom:0;}
.msg-content code{
  background:var(--surface);
  border:1px solid var(--border);
  padding:2px 6px;
  border-radius:4px;
  font-size:13px;
  color:var(--accent);
  font-family:monospace;
}
.msg-content pre{
  background:#0a0a0a;
  border:1px solid var(--border);
  border-radius:10px;
  padding:1rem;
  overflow-x:auto;
  margin:10px 0;
  font-size:13px;
  line-height:1.6;
}
.msg-content pre code{background:none;border:none;padding:0;color:#e6edf3;}
.msg-content strong{font-weight:600;}
.msg-content ul,.msg-content ol{padding-left:1.5rem;margin:8px 0;}
.msg-content li{margin-bottom:4px;}

/* Typing */
.typing-dots{display:flex;gap:4px;align-items:center;padding:4px 0;}
.typing-dots span{
  width:7px;height:7px;border-radius:50%;
  background:var(--mu);
  animation:bounce .8s infinite;
}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}

/* Input */
.input-area{
  padding:1rem 1.5rem 1.5rem;
  max-width:760px;
  margin:0 auto;
  width:100%;
}
.input-wrap{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 14px;
  display:flex;
  gap:10px;
  align-items:flex-end;
  transition:border-color .2s;
}
.input-wrap:focus-within{border-color:rgba(16,163,127,0.5);}
#msgInput{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:var(--tx);
  font-size:15px;
  font-family:'Inter',sans-serif;
  resize:none;
  max-height:160px;
  min-height:24px;
  line-height:1.6;
}
#msgInput::placeholder{color:var(--mu);}
.send-btn{
  width:34px;height:34px;
  border-radius:8px;
  background:var(--accent);
  border:none;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;
  flex-shrink:0;
}
.send-btn:hover{background:var(--accent-hover);}
.send-btn:disabled{background:var(--border);cursor:not-allowed;}
.send-btn svg{width:16px;height:16px;fill:#fff;}
.input-note{text-align:center;font-size:11px;color:var(--mu);margin-top:8px;}

/* Overlay */
.overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  z-index:10;
}
.overlay.active{display:block;}

/* Mobile */
@media(max-width:768px){
  .sidebar{
    position:fixed;
    left:0;top:0;bottom:0;
    z-index:20;
    transform:translateX(-100%);
  }
  .sidebar.open{transform:translateX(0);}
  .mobile-header{display:flex;}
  .msg{padding:0.75rem 1rem;}
  .msg.user .msg-content{max-width:85%;}
  .input-area{padding:0.75rem 1rem 1rem;}
  .welcome h1{font-size:22px;}
}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <button class="new-chat-btn" onclick="newChat()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>
  </div>
  <div class="sidebar-label">Recent Chats</div>
  <div class="chat-list" id="chatList"></div>
  <div class="sidebar-bottom">
    <div class="user-info">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-name" id="userName">Loading...</div>
      <button class="logout-btn" onclick="window.location.href='/logout'">Logout</button>
    </div>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="mobile-header">
    <button class="menu-btn" onclick="openSidebar()">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="mobile-title"><span>Emmy</span>AI</div>
    <button class="new-chat-btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick="newChat()">+ New</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🤖</div>
      <h1>Hello, I'm <span>EmmyAI</span></h1>
      <p>Your intelligent AI assistant. Start a new chat or pick up where you left off.</p>
      <div class="suggestions">
        <div class="sug" onclick="useSuggestion(this)">What can you do?</div>
        <div class="sug" onclick="useSuggestion(this)">Write me a Python script</div>
        <div class="sug" onclick="useSuggestion(this)">Explain AI in simple terms</div>
        <div class="sug" onclick="useSuggestion(this)">Give me business ideas</div>
        <div class="sug" onclick="useSuggestion(this)">Help me write an email</div>
        <div class="sug" onclick="useSuggestion(this)">Tell me a fun fact</div>
      </div>
    </div>
  </div>

  <div style="border-top:1px solid var(--border);padding:0.5rem 0;">
    <div class="input-area">
      <div class="input-wrap">
        <textarea id="msgInput" placeholder="Message EmmyAI..." rows="1" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="input-note">Built by EmmyTech</div>
    </div>
  </div>
</div>

<script>
const USER_NAME = "{{ user.name }}";
const USER_INITIAL = USER_NAME.charAt(0).toUpperCase();
document.getElementById('userAvatar').textContent = USER_INITIAL;
document.getElementById('userName').textContent = USER_NAME;

let currentChatId = null;
let isLoading = false;

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('active');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}

function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,160)+'px';
}

function formatText(text){
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
  text = text.replace(/^### (.*$)/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.*$)/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.*$)/gm, '<h1>$1</h1>');
  // Lists
  text = text.replace(/^\- (.*$)/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  // Paragraphs
  const parts = text.split('\n\n').filter(p => p.trim());
  return parts.map(p => {
    if(p.startsWith('<pre>') || p.startsWith('<ul>') || p.startsWith('<h')) return p;
    return `<p>${p.replace(/\n/g,'<br>')}</p>`;
  }).join('');
}

function appendMessage(role, content){
  const area = document.getElementById('chatArea');
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.remove();

  let msgsDiv = area.querySelector('.messages');
  if(!msgsDiv){
    msgsDiv = document.createElement('div');
    msgsDiv.className = 'messages';
    area.appendChild(msgsDiv);
  }

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const initial = role === 'user' ? USER_INITIAL : '🤖';
  div.innerHTML = `
    <div class="msg-avatar">${initial}</div>
    <div class="msg-content">${role==='user' ? `<p>${content}</p>` : formatText(content)}</div>
  `;
  msgsDiv.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function showTyping(){
  const area = document.getElementById('chatArea');
  let msgsDiv = area.querySelector('.messages');
  if(!msgsDiv){msgsDiv=document.createElement('div');msgsDiv.className='messages';area.appendChild(msgsDiv);}
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typingIndicator';
  div.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-content"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  msgsDiv.appendChild(div);
  area.scrollTop = area.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typingIndicator');if(t)t.remove();}

async function loadChats(){
  const res = await fetch('/api/chats');
  const chats = await res.json();
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  chats.forEach(c => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
    div.dataset.id = c.id;
    div.innerHTML = `<span class="chat-title">${c.title}</span><button class="chat-del" onclick="deleteChat(event,${c.id})">✕</button>`;
    div.addEventListener('click', () => loadChat(c.id));
    list.appendChild(div);
  });
}

async function loadChat(id){
  currentChatId = id;
  closeSidebar();
  const res = await fetch(`/api/chats/${id}`);
  const data = await res.json();
  const area = document.getElementById('chatArea');
  area.innerHTML = '<div class="messages"></div>';
  data.messages.forEach(m => appendMessage(m.role === 'assistant' ? 'ai' : 'user', m.content));
  document.querySelectorAll('.chat-item').forEach(el => el.classList.toggle('active', parseInt(el.dataset.id) === id));
  area.scrollTop = area.scrollHeight;
}

async function newChat(){
  const res = await fetch('/api/chats', {method:'POST'});
  const chat = await res.json();
  currentChatId = chat.id;
  const area = document.getElementById('chatArea');
  area.innerHTML = `<div class="welcome" id="welcome">
    <div class="welcome-icon">🤖</div>
    <h1>Hello, I'm <span style="color:var(--accent)">EmmyAI</span></h1>
    <p>Start typing below to begin your conversation.</p>
    <div class="suggestions">
      <div class="sug" onclick="useSuggestion(this)">What can you do?</div>
      <div class="sug" onclick="useSuggestion(this)">Write me a Python script</div>
      <div class="sug" onclick="useSuggestion(this)">Explain AI in simple terms</div>
      <div class="sug" onclick="useSuggestion(this)">Give me business ideas</div>
    </div>
  </div>`;
  await loadChats();
  closeSidebar();
  document.getElementById('msgInput').focus();
}

async function deleteChat(e, id){
  e.stopPropagation();
  await fetch(`/api/chats/${id}`, {method:'DELETE'});
  if(currentChatId === id){
    currentChatId = null;
    document.getElementById('chatArea').innerHTML = '';
  }
  await loadChats();
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || isLoading) return;

  // Create chat if none
  if(!currentChatId){
    const res = await fetch('/api/chats', {method:'POST'});
    const chat = await res.json();
    currentChatId = chat.id;
  }

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  appendMessage('user', text);
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: currentChatId, message: text})
    });
    const data = await res.json();
    removeTyping();
    if(data.success){
      appendMessage('ai', data.reply);
      await loadChats();
    } else {
      appendMessage('ai', '⚠️ Sorry, something went wrong. Please try again.');
    }
  } catch(e){
    removeTyping();
    appendMessage('ai', '⚠️ Connection error. Please try again.');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function useSuggestion(el){
  document.getElementById('msgInput').value = el.textContent;
  sendMessage();
}

document.getElementById('msgInput').addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){e.preventDefault();sendMessage();}
});

// Init
loadChats();
</script>
</body>
</html>
