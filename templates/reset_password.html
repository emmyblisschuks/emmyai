<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EmmyAI — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0d0d0d;--surface:#1a1a1a;--border:#2d2d2d;--accent:#10a37f;--accent-hover:#0d8f6f;--tx:#ececec;--mu:#8e8ea0;--error:#ff4d4f;--input-bg:#141414;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(16,163,127,0.12),transparent);pointer-events:none;}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;position:relative;z-index:1;}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2rem;}
.logo-icon{width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.logo-text{font-size:22px;font-weight:600;letter-spacing:-0.02em;}
.logo-text span{color:var(--accent);}
h2{font-size:20px;font-weight:600;text-align:center;margin-bottom:0.4rem;}
.sub{text-align:center;font-size:13px;color:var(--mu);margin-bottom:1.8rem;}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:12px;font-weight:500;color:var(--mu);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input{width:100%;padding:11px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:9px;color:var(--tx);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--accent);}
.field input::placeholder{color:var(--mu);}
.btn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:background .2s;margin-top:0.5rem;}
.btn:hover{background:var(--accent-hover);}
.btn:disabled{opacity:0.6;cursor:not-allowed;}
.error-msg{background:rgba(255,77,79,0.1);border:1px solid rgba(255,77,79,0.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--error);margin-bottom:1rem;}
.success-msg{background:rgba(16,163,127,0.1);border:1px solid rgba(16,163,127,0.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--accent);margin-bottom:1rem;display:none;}
.back{text-align:center;margin-top:1.5rem;font-size:13px;color:var(--mu);}
.back a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <div class="logo-text"><span>Emmy</span>AI</div>
  </div>
  <h2>Reset Password</h2>
  <p class="sub">Enter your new password below.</p>
  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% else %}
  <div id="errorMsg" class="error-msg" style="display:none"></div>
  <div id="successMsg" class="success-msg"></div>
  <div id="formSection">
    <div class="field">
      <label>New Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters"/>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirm" placeholder="Repeat password"/>
    </div>
    <button class="btn" id="submitBtn" onclick="submitReset()">Reset Password</button>
  </div>
  {% endif %}
  <div class="back"><a href="/login">← Back to Sign In</a></div>
</div>
<script>
const TOKEN = "{{ token }}";
async function submitReset(){
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  if(!password || !confirm) return showError('Please fill in all fields');
  if(password !== confirm) return showError('Passwords do not match');
  if(password.length < 6) return showError('Password must be at least 6 characters');
  const btn = document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='Resetting...';
  try {
    const res = await fetch(`/reset-password/${TOKEN}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
    const data = await res.json();
    if(data.success){
      document.getElementById('formSection').style.display='none';
      const s = document.getElementById('successMsg');
      s.textContent='✅ Password reset! Redirecting to login...';
      s.style.display='block';
      setTimeout(()=>window.location.href='/login', 2000);
    } else showError(data.error);
  } catch(e){showError('Connection error. Try again.');}
  btn.disabled=false; btn.textContent='Reset Password';
}
function showError(msg){const e=document.getElementById('errorMsg');e.textContent=msg;e.style.display='block';}
</script>
</body>
</html>
